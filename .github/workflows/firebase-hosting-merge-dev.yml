# Deploys the dev app to the single Showmaster Firebase project.
# https://github.com/firebase/firebase-tools

name: Deploy Firebase dev on dev push
on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: "Deploy Cloud Functions. Requires the Firebase project to be on Blaze."
        required: false
        default: "false"
  push:
    branches:
      - dev
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      id-token: write   # required for Workload Identity Federation
      contents: read    # to checkout code
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: "projects/904627453868/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-firebase-deployer@showmaster1-f1a9f.iam.gserviceaccount.com"
      - name: Create .env for React build
        run: |
          cat > .env << 'EOF'
          REACT_APP_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          EOF
      - name: Install app dependencies
        run: npm ci
      - name: Install functions dependencies
        run: npm --prefix functions ci
      - name: Test app
        env:
          CI: true
          DISABLE_ESLINT_PLUGIN: true
        run: npm test -- --watchAll=false
      - name: Build app
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true
        run: npm run build
      - name: Check functions syntax
        run: |
          git ls-files 'functions/**/*.js' functions/index.js | xargs -n 1 node --check
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Firebase Hosting and rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_GHA_CREDS_PATH }}
        run: |
          firebase deploy --only hosting,firestore:rules,storage --project showmaster1-f1a9f --non-interactive --message "CI deploy (dev)"
      - name: Deploy Firebase Functions
        if: ${{ vars.DEPLOY_FUNCTIONS == 'true' || inputs.deploy_functions == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_GHA_CREDS_PATH }}
        run: |
          firebase deploy --only functions --project showmaster1-f1a9f --non-interactive --message "CI deploy functions (dev)"
